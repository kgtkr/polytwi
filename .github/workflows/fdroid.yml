name: Deploy F-Droid Repository

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: versioning
        run: |
          # versionCode is Unix timestamp in seconds (monotonically increasing, safely under 2^31 - 1)
          V_CODE=$(date +%s)
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            V_NAME="${{ github.ref_name }}"
          else
            V_NAME="$(date -u +'%Y.%m.%d-%H%M')"
          fi
          
          echo "version_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "Building PolyTwi version: $V_NAME (versionCode: $V_CODE)"

      - name: Setup Nix Environment
        uses: ./.github/actions/setup

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore Keystore and Firebase Config from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > polytwi-release.jks
          cat <<'EOF' > keystore.properties
          storeFile=../polytwi-release.jks
          EOF
          printf "storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> keystore.properties
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

      - name: Build Release APK
        env:
          PUSH_BRIDGE_URL: ${{ secrets.PUSH_BRIDGE_URL }}
        run: |
          gradle assembleRelease \
            -PversionCode=${{ steps.versioning.outputs.version_code }} \
            -PversionName=${{ steps.versioning.outputs.version_name }}

      - name: Setup F-Droid Repository Structure
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p fdroid-site/fdroid/repo
          cp app/build/outputs/apk/release/app-release.apk fdroid-site/fdroid/repo/polytwi-${{ steps.versioning.outputs.version_name }}.apk
          
          cat <<EOF > fdroid-site/fdroid/config.yml
          repo_name: "PolyTwi Repository"
          repo_description: "Unofficial multi-account PWA wrapper for X (Twitter)"
          repo_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/fdroid/repo"
          keystore: "$GITHUB_WORKSPACE/polytwi-release.jks"
          EOF
          printf "repo_keyalias: \"%s\"\nkeystorepass: \"%s\"\nkeypass: \"%s\"\n" \
            "$KEY_ALIAS" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" >> fdroid-site/fdroid/config.yml

      - name: Generate F-Droid Metadata
        run: |
          cd fdroid-site/fdroid
          fdroid update --create-metadata --use-date-from-apk

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version_name }}
          name: PolyTwi ${{ steps.versioning.outputs.version_name }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
