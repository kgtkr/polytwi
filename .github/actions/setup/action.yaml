name: Setup
description: "Setup"

runs:
  using: "composite"
  steps:
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main
    - name: Build devShell
      run: |
        nix print-dev-env > result-devShell.sh
        echo "BASH_ENV=$PWD/result-devShell.sh" >> $GITHUB_ENV
      shell: bash
